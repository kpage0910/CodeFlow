<!--
  feedback.html – CodeFlow feedback page.
  Core: Simple page that links to an external feedback form (e.g. Google Form); used by the Feedback button in the app.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Feedback – CodeFlow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="landing-page feedback-page">
    <header class="landing-header">
      <a href="/" class="landing-header-brand">CodeFlow</a>
    </header>

    <main class="main feedback-main">
      <section class="feedback-section">
        <p class="feedback-message">Send feedback / feature requests</p>
        <a
          href="__FEEDBACK_URL__"
          target="_blank"
          rel="noopener"
          class="feedback-cta btn"
          >Open feedback form</a
        >
        <p class="feedback-back">
          <a href="/" class="feedback-back-link">← Back to Home</a>
        </p>
      </section>
    </main>
  </body>
</html>
